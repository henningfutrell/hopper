# The bundled Postgres for a hopper installed on this host by scripts/install.sh (docs/deploy.md), and
# for local development. The hopper in containers is compose.yaml at the root.
#
#   POSTGRES_PASSWORD=<password> docker compose -f deploy/compose.yaml up -d postgres
#   HOPPER_DATABASE_URL=postgres://hopper:<password>@127.0.0.1:${POSTGRES_PORT:-5433}/hopper
name: hopper

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hopper
      POSTGRES_DB: hopper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    # Loopback only: for the host-installed hopper and for backups.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopper -d hopper"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres:
    # The database's data, under the name compose gave it when the project was job-hopper (issue #112):
    # under the project's own name it would be a new, empty volume beside the data.
    name: job-hopper_postgres
