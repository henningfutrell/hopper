{{- /*
The values the hopper's Postgres, OpenFGA, the vault pod and the tunnel services share, made at the first install and
kept at each upgrade (read back from the Secret). Kept at an uninstall too: the database volume keeps the password it was
made with. The vault's and the tunnel services' keys are made whether those parts are on or not, so turning one on later
keeps the keys the others hold. With an external database (issue #1282), its URLs are in that database's own Secret.
*/ -}}
{{- $name := include "hopper.runtimeSecret" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $password := get $old "postgres_password" | b64dec | default (randAlphaNum 40) -}}
{{- $fgaKey := get $old "openfga_key" | b64dec | default (randAlphaNum 48) -}}
{{- $vaultKey := get $old "vault_key" | b64dec | default (randAlphaNum 48) -}}
{{- $tunnelKey := get $old "tunnel_key" | b64dec | default (randAlphaNum 48) -}}
{{- $db := printf "%s-postgres" (include "hopper.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopper.labels" (dict "ctx" . "component" "runtime") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.postgres.bundled }}
  postgres_password: {{ $password | quote }}
  database_url: {{ printf "postgres://hopper:%s@%s:5432/hopper" $password $db | quote }}
  openfga_datastore_uri: {{ printf "postgres://hopper:%s@%s:5432/hopper?sslmode=disable&search_path=openfga" $password $db | quote }}
  {{- end }}
  openfga_key: {{ $fgaKey | quote }}
  # The vault pod's preshared key (hopperVault.enabled): made at the first install all the same, kept for when it is on.
  vault_key: {{ $vaultKey | quote }}
  tunnel_key: {{ $tunnelKey | quote }}
