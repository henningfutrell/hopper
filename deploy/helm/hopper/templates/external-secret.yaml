{{- /*
The master key Secret, filled by the External Secrets Operator from an outside store (issue #1288). The operator, its
CRDs and the SecretStore are the cluster's; the chart makes only the ExternalSecret. The Secret stays when the
ExternalSecret goes: the key in it seals every secret the hopper keeps.
*/ -}}
{{- with .Values.masterKey.externalSecret }}
{{- if .enabled }}
{{- $name := include "hopper.masterKeySecret" $ }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopper.labels" (dict "ctx" $ "component" "master-key") | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "masterKey.externalSecret.secretStoreRef.name: the SecretStore or ClusterSecretStore that keeps the master key" .secretStoreRef.name }}
    kind: {{ .secretStoreRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: master-key
      remoteRef:
        key: {{ required "masterKey.externalSecret.masterKey.key: the remote key of the master key" .masterKey.key | quote }}
        {{- with .masterKey.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- if .previous.key }}
    - secretKey: previous
      remoteRef:
        key: {{ .previous.key | quote }}
        {{- with .previous.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
