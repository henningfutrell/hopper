{{- if .Values.hopper.enabled }}
{{- /*
The hopper's own service account (issue #1288): its annotations give the pod an AWS role, for AWS KMS. With
sandbox.enabled (issue #1286) it holds the Role the Kubernetes runtime needs (sandbox.yaml).
*/ -}}
{{- if include "hopper.makesServiceAccount" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hopper.serviceAccount" . }}
  labels:
    {{- include "hopper.labels" (dict "ctx" . "component" "hopper") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
