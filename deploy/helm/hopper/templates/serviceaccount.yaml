{{- /* The hopper's own service account (issue #1288): its annotations give the pod an AWS role, for AWS KMS. */ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hopper.serviceAccount" . }}
  labels:
    {{- include "hopper.labels" (dict "ctx" . "component" "hopper") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
