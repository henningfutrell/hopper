{{- $name := include "hopper.fullname" . -}}
{{- $sel := dict "ctx" . "component" "hopper" -}}
{{- $image := printf "%s:%s" .Values.image.repository (.Values.image.tag | toString) -}}
{{- $port := .Values.port | int -}}
{{- $ns := .Release.Namespace -}}
{{- $account := include "hopper.serviceAccount" . -}}
{{- $replicas := .Values.replicas | int -}}
{{- if or (lt $replicas 0) (gt $replicas 1) }}{{ fail "replicas is 0 or 1: one hopper writes its database" }}{{ end -}}
{{- $serviceType := .Values.service.type -}}
{{- if not (has $serviceType (list "ClusterIP" "LoadBalancer" "NodePort")) }}{{ fail "service.type is ClusterIP, LoadBalancer or NodePort" }}{{ end -}}
{{- $lanNames := list (printf "%s,%s.%s,%s.%s.svc,%s.%s.svc.%s" $name $name $ns $name $ns $name $ns .Values.clusterDomain) -}}
{{- range splitList "," (.Values.lanNames | toString) }}{{ if trim . }}{{ $lanNames = append $lanNames (trim .) }}{{ end }}{{ end -}}
{{- $health := printf "fetch('http://127.0.0.1:%d/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))" $port -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopper.labels" $sel | nindent 4 }}
spec:
  type: {{ $serviceType }}
  selector:
    {{- include "hopper.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-home
  labels:
    {{- include "hopper.labels" $sel | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- include "hopper.storageClass" .Values.home.storageClass | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.home.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopper.labels" $sel | nindent 4 }}
spec:
  # One hopper: one writer of its database and its home. An update stops the old pod before the new one starts. 0 while
  # a compose install's data moves in (scripts/hopper-cluster.sh migrate, issue #1373).
  replicas: {{ $replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hopper.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hopper.labels" $sel | nindent 8 }}
    spec:
      {{- if $account }}
      # Its AWS role (IRSA or EKS Pod Identity), for AWS KMS: the webhook mounts its own token. With sandbox.enabled, the
      # account the sandbox Role is bound to.
      serviceAccountName: {{ $account }}
      {{- end }}
      # With sandbox.enabled, the Kubernetes API client reads the token: the hopper starts its sandbox boxes with it.
      automountServiceAccountToken: {{ .Values.sandbox.enabled }}
      # No <SERVICE>_PORT=tcp://… variables: for the Service `hopper` they would be HOPPER_* variables.
      enableServiceLinks: false
      # The image's node user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # The hopper stops when it cannot reach its database: it starts once Postgres takes connections.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          {{- if .Values.postgres.bundled }}
          command: [sh, -c, {{ printf "until pg_isready -q -h %s-postgres -U hopper -d hopper; do sleep 2; done" $name | quote }}]
          {{- else }}
          command: [sh, -c, 'until pg_isready -q -d "$DATABASE_URL"; do sleep 2; done']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hopper.databaseSecret" . }}
                  key: database_url
          {{- end }}
          {{- include "hopper.containerSecurity" . | nindent 10 }}
      containers:
        - name: hopper
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "hopper.podLimits" "hopper" | nindent 12 }}
            {{- if .Values.postgres.bundled }}
            - name: HOPPER_DATABASE_URL_FILE
              value: /run/hopper-secrets/database_url
            {{- end }}
            {{- if not .Values.postgres.bundled }}
            # The external database (issue #1282).
            - name: HOPPER_DATABASE_URL_FILE
              value: /run/hopper-database/database_url
            {{- end }}
            {{- include "hopper.masterKeyEnv" . | nindent 12 }}
            {{- if .Values.hopperVault.enabled }}
            # The vault in a pod of its own (issue #586), asked with the preshared key.
            - name: HOPPER_VAULT_URL
              value: {{ printf "http://%s-vault:4791" $name | quote }}
            - name: HOPPER_VAULT_KEY_FILE
              value: /run/hopper-secrets/vault_key
            {{- else }}
            {{- include "hopper.kmsEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.tunnel.ngrok.enabled }}
            - name: HOPPER_TUNNEL_API
              value: {{ printf "http://%s-tunnel:4040" $name | quote }}
            {{- end }}
            {{- if .Values.tunnel.cloudflared.enabled }}
            - name: HOPPER_CLOUDFLARED_API
              value: {{ printf "http://%s-cloudflared:2000" $name | quote }}
            {{- end }}
            {{- if or .Values.tunnel.ngrok.enabled .Values.tunnel.cloudflared.enabled }}
            # The key the tunnel services ask GET /tunnel/agent with.
            - name: HOPPER_TUNNEL_KEY_FILE
              value: /run/hopper-secrets/tunnel_key
            {{- end }}
            - name: HOPPER_PORT
              value: {{ $port | quote }}
            - name: HOPPER_OPENFGA_URL
              value: {{ printf "http://%s-openfga:8080" $name | quote }}
            - name: HOPPER_OPENFGA_KEY_FILE
              value: /run/hopper-secrets/openfga_key
            # The key lane pods join with (issue #1284), read at each join.
            - name: HOPPER_LANE_POOL_KEY_FILE
              value: /run/lane-pool/key
            {{- if .Values.solr.enabled }}
            - name: HOPPER_SOLR_URL
              value: {{ printf "http://%s-solr:8983/solr/hopper" $name | quote }}
            {{- end }}
            # The names the cluster reaches it by; the first is the one in question links. Then lanNames: the names machines
            # outside the cluster reach it by.
            - name: HOPPER_LAN_NAMES
              value: {{ join "," $lanNames | quote }}
            - name: HOPPER_LAN_PEERS
              value: {{ .Values.lanPeers | quote }}
            {{- if .Values.sandbox.enabled }}
            # Sandbox boxes as pods in this namespace (issue #1286). A box's egress policy lets it reach this pod alone.
            - name: HOPPER_SANDBOX_RUNTIME
              value: kubernetes
            - name: HOPPER_KUBERNETES_HOPPER_LABELS
              value: {{ include "hopper.selector" $sel | replace ": " "=" | splitList "\n" | join "," | quote }}
            {{- end }}
            {{- if .Values.ingress.enabled }}
            - name: HOPPER_PUBLIC_URL
              value: {{ .Values.ingress.publicUrl | default (printf "https://%s" (required "ingress.host: the host name the Ingress publishes the hopper on" .Values.ingress.host)) | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
          # Asked on the pod's loopback, as the image's own check: a probe from the node would be a LAN request.
          startupProbe:
            exec:
              command: [node, -e, {{ $health | quote }}]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: [node, -e, {{ $health | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [node, -e, {{ $health | quote }}]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          {{- include "hopper.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /run/hopper-secrets
              readOnly: true
            - name: lane-pool
              mountPath: /run/lane-pool
              readOnly: true
            # Its home: the claude sign-in.
            - name: home
              mountPath: /home/node
            - name: master-key
              mountPath: /run/hopper-master-key
              readOnly: true
            {{- if not .Values.postgres.bundled }}
            - name: database
              mountPath: /run/hopper-database
              readOnly: true
            {{- end }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ include "hopper.runtimeSecret" . }}
            defaultMode: 0440
            items:
              {{- if .Values.postgres.bundled }}
              - key: database_url
                path: database_url
              {{- end }}
              - key: openfga_key
                path: openfga_key
              {{- if .Values.hopperVault.enabled }}
              - key: vault_key
                path: vault_key
              {{- end }}
              {{- if or .Values.tunnel.ngrok.enabled .Values.tunnel.cloudflared.enabled }}
              - key: tunnel_key
                path: tunnel_key
              {{- end }}
        {{- if not .Values.postgres.bundled }}
        - name: database
          secret:
            secretName: {{ include "hopper.databaseSecret" . }}
            defaultMode: 0440
            items:
              - key: database_url
                path: database_url
        {{- end }}
        - name: lane-pool
          secret:
            secretName: {{ include "hopper.lanePoolSecret" . }}
            defaultMode: 0440
            items:
              - key: key
                path: key
        - name: home
          persistentVolumeClaim:
            claimName: {{ $name }}-home
        {{- include "hopper.masterKeyVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
