{{- if .Values.networkPolicy.enabled -}}
{{- /*
Who reaches each part: Postgres the hopper, OpenFGA and the vault pod; OpenFGA, Solr and the vault pod the hopper alone;
the local KMS the pod the vault runs in; the lane pods no one.
*/ -}}
{{- $db := list "hopper" "openfga" -}}
{{- if .Values.hopperVault.enabled -}}
{{- $db = append $db "vault" -}}
{{- end -}}
{{- $parts := list (list "postgres" 5432 $db) (list "openfga" 8080 (list "hopper")) (list "lanes" 0 list) -}}
{{- if .Values.solr.enabled -}}
{{- $parts = append $parts (list "solr" 8983 (list "hopper")) -}}
{{- end -}}
{{- if .Values.hopperVault.enabled -}}
{{- $parts = append $parts (list "vault" 4791 (list "hopper")) -}}
{{- end -}}
{{- if .Values.kms.local.enabled -}}
{{- $parts = append $parts (list "kms" 8080 (list (include "hopper.vaultRunner" $))) -}}
{{- end -}}
{{- range $i, $p := $parts }}
{{- if $i }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-%s" (include "hopper.fullname" $) (index $p 0) }}
  labels:
    {{- include "hopper.labels" (dict "ctx" $ "component" (index $p 0)) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hopper.selector" (dict "ctx" $ "component" (index $p 0)) | nindent 6 }}
  policyTypes: [Ingress]
  {{- if not (index $p 2) }}
  # They dial out: nothing reaches them.
  ingress: []
  {{- else }}
  ingress:
    - from:
        {{- range (index $p 2) }}
        - podSelector:
            matchLabels:
              {{- include "hopper.selector" (dict "ctx" $ "component" .) | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ index $p 1 }}
  {{- end }}
{{- end }}
{{- end }}
