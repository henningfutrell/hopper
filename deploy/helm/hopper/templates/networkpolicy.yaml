{{- if .Values.networkPolicy.enabled -}}
{{- /*
Who reaches each part: Postgres the hopper, OpenFGA, its migration and the vault pod; OpenFGA, Solr, the vault pod, the
tunnel services and the telemetry viewer's OTLP port the hopper alone; the local KMS the pod the vault runs in; the lane pods no one.
With lanes.egress.confine (issue #2849 part 6), the lane pods also reach only DNS and the hopper. A runner-only release
(hopper.enabled=false, issue #1454) has the lane pods' alone.
*/ -}}
{{- $parts := list -}}
{{- if .Values.hopper.enabled -}}
{{- $parts = append $parts (list "openfga" 8080 (list "hopper")) -}}
{{- end -}}
{{- $parts = append $parts (list "lanes" 0 list) -}}
{{- if .Values.hopper.enabled -}}
{{- if .Values.postgres.bundled -}}
{{- $db := list "hopper" "openfga" "openfga-migrate" -}}
{{- if .Values.hopperVault.enabled -}}
{{- $db = append $db "vault" -}}
{{- end -}}
{{- $parts = append $parts (list "postgres" 5432 $db) -}}
{{- end -}}
{{- if .Values.solr.enabled -}}
{{- $parts = append $parts (list "solr" 8983 (list "hopper")) -}}
{{- end -}}
{{- if .Values.telemetry.viewer.enabled -}}
{{- $parts = append $parts (list "telemetry" 4318 (list "hopper")) -}}
{{- end -}}
{{- if .Values.hopperVault.enabled -}}
{{- $parts = append $parts (list "vault" 4791 (list "hopper")) -}}
{{- end -}}
{{- if .Values.kms.local.enabled -}}
{{- $parts = append $parts (list "kms" 8080 (list (include "hopper.vaultRunner" $))) -}}
{{- end -}}
{{- if .Values.tunnel.ngrok.enabled -}}
{{- $parts = append $parts (list "tunnel" 4040 (list "hopper")) -}}
{{- end -}}
{{- if .Values.tunnel.cloudflared.enabled -}}
{{- $parts = append $parts (list "cloudflared" 2000 (list "hopper")) -}}
{{- end -}}
{{- end -}}
{{- range $i, $p := $parts }}
{{- if $i }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-%s" (include "hopper.fullname" $) (index $p 0 | trimPrefix "hopper-") }}
  labels:
    {{- include "hopper.labels" (dict "ctx" $ "component" (index $p 0)) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hopper.selector" (dict "ctx" $ "component" (index $p 0)) | nindent 6 }}
  {{- $confined := and (eq (index $p 0) "lanes") $.Values.lanes.egress.confine }}
  policyTypes: {{ ternary "[Ingress, Egress]" "[Ingress]" $confined }}
  {{- if not (index $p 2) }}
  # They dial out: nothing reaches them.
  ingress: []
  {{- if $confined }}
  {{- include "hopper.lanesEgress" $ | nindent 2 }}
  {{- end }}
  {{- else }}
  ingress:
    - from:
        {{- range (index $p 2) }}
        - podSelector:
            matchLabels:
              {{- include "hopper.selector" (dict "ctx" $ "component" .) | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ index $p 1 }}
  {{- end }}
{{- end }}
{{- end }}
