{{- if .Values.hopper.enabled }}
{{- if .Values.hopperVault.enabled -}}
{{- /*
The hopper's vault in a pod of its own (the compose profile `hopper-vault`, issue #586): `node src/vault/main.ts` of the
hopper's image. It holds the vault's key and the secret values, in the hopper's Postgres. The hopper asks it at its
Service with the preshared key `vault_key` of the runtime Secret; only the hopper reaches it.
*/ -}}
{{- $name := printf "%s-vault" (include "hopper.fullname" .) -}}
{{- $sel := dict "ctx" . "component" "vault" -}}
{{- $image := printf "%s:%s" .Values.image.repository (.Values.image.tag | toString) -}}
{{- $account := include "hopper.serviceAccount" . -}}
{{- $health := "fetch('http://127.0.0.1:4791/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopper.labels" $sel | nindent 4 }}
spec:
  selector:
    {{- include "hopper.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: 4791
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopper.labels" $sel | nindent 4 }}
spec:
  # One vault: one holder of its key. An update stops the old pod before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hopper.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hopper.labels" $sel | nindent 8 }}
    spec:
      {{- if $account }}
      # Its AWS role (IRSA or EKS Pod Identity), for AWS KMS: the webhook mounts its own token.
      serviceAccountName: {{ $account }}
      {{- end }}
      # It asks no Kubernetes API.
      automountServiceAccountToken: false
      # No <SERVICE>_PORT=tcp://… variables: for the Service `hopper` they would be HOPPER_* variables.
      enableServiceLinks: false
      # The image's node user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # The vault stops when it cannot reach its database: it starts once Postgres takes connections.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          {{- if .Values.postgres.bundled }}
          command: [sh, -c, {{ printf "until pg_isready -q -h %s-postgres -U hopper -d hopper; do sleep 2; done" (include "hopper.fullname" .) | quote }}]
          {{- else }}
          command: [sh, -c, 'until pg_isready -q -d "$DATABASE_URL"; do sleep 2; done']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hopper.databaseSecret" . }}
                  key: database_url
          {{- end }}
          {{- include "hopper.containerSecurity" . | nindent 10 }}
      containers:
        - name: hopper-vault
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image's entrypoint runs it, as compose's `command`.
          args: [node, src/vault/main.ts]
          env:
            - name: HOPPER_DATABASE_URL_FILE
              {{- if .Values.postgres.bundled }}
              value: /run/hopper-secrets/database_url
              {{- else }}
              # The external database (issue #1282).
              value: /run/hopper-database/database_url
              {{- end }}
            {{- include "hopper.masterKeyEnv" . | nindent 12 }}
            - name: HOPPER_VAULT_KEY_FILE
              value: /run/hopper-secrets/vault_key
            {{- include "hopper.kmsEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 4791
          # Asked on the pod's loopback, as compose's check.
          readinessProbe:
            exec:
              command: [node, -e, {{ $health | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [node, -e, {{ $health | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          {{- include "hopper.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.hopperVault.resources | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /run/hopper-secrets
              readOnly: true
            {{- if not .Values.postgres.bundled }}
            - name: database
              mountPath: /run/hopper-database
              readOnly: true
            {{- end }}
            - name: master-key
              mountPath: /run/hopper-master-key
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: {{ include "hopper.runtimeSecret" . }}
            defaultMode: 0440
            items:
              {{- if .Values.postgres.bundled }}
              - key: database_url
                path: database_url
              {{- end }}
              - key: vault_key
                path: vault_key
        {{- if not .Values.postgres.bundled }}
        - name: database
          secret:
            secretName: {{ include "hopper.databaseSecret" . }}
            defaultMode: 0440
            items:
              - key: database_url
                path: database_url
        {{- end }}
        {{- include "hopper.masterKeyVolume" . | nindent 8 }}
{{- end }}
{{- end }}
