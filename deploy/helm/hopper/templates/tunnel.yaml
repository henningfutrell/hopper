{{- /*
Remote access (issue #1282, docs/deploy.md "Remote access"): compose's tunnel services. Each asks the hopper for its
settings with the tunnel key, and runs no agent until remote access is on with its provider. Their scripts are
compose.yaml's own (files/, checked equal by test/scripts/helm-chart-parts.test.ts), with the hopper's Service name in
place of compose's `hopper`.
*/ -}}
{{- define "hopper.tunnelPod" -}}
{{- $root := .root -}}
{{- $hopper := include "hopper.fullname" $root -}}
{{- $name := printf "%s-%s" $hopper .component -}}
{{- $sel := dict "ctx" $root "component" .component -}}
{{- $script := $root.Files.Get .script | replace "http://hopper:" (printf "http://%s:" $hopper) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-script
  labels:
    {{- include "hopper.labels" $sel | nindent 4 }}
data:
  script.sh: |
    {{- $script | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopper.labels" $sel | nindent 4 }}
spec:
  selector:
    {{- include "hopper.selector" $sel | nindent 4 }}
  ports:
    - name: api
      port: {{ .apiPort }}
      targetPort: {{ .apiPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hopper.labels" $sel | nindent 4 }}
spec:
  replicas: 1
  # One agent of the tunnel at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hopper.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hopper.labels" $sel | nindent 8 }}
      annotations:
        checksum/script: {{ $script | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # No <SERVICE>_PORT=tcp://… variables: for the Service `hopper` they would be HOPPER_* variables.
      enableServiceLinks: false
      # The image's own user.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .uid }}
        runAsGroup: {{ .gid }}
      containers:
        - name: {{ .component }}
          image: {{ .image }}
          command: [sh, -eu, /hopper-tunnel-script/script.sh]
          env:
            - name: HOPPER_PORT
              value: {{ $root.Values.port | quote }}
          {{- include "hopper.containerSecurity" $root | nindent 10 }}
          volumeMounts:
            - name: key
              mountPath: /run/hopper-tunnel
              readOnly: true
            - name: script
              mountPath: /hopper-tunnel-script
              readOnly: true
      volumes:
        - name: key
          secret:
            secretName: {{ include "hopper.runtimeSecret" $root }}
            defaultMode: 0444
            items:
              - key: tunnel_key
                path: key
        - name: script
          configMap:
            name: {{ $name }}-script
{{- end -}}
{{- $parts := list -}}
{{- if and .Values.hopper.enabled .Values.tunnel.ngrok.enabled -}}
{{- $parts = append $parts (dict "root" . "component" "tunnel" "image" .Values.tunnel.ngrok.image "script" "files/tunnel.sh" "apiPort" 4040 "uid" 1000 "gid" 100) -}}
{{- end -}}
{{- if and .Values.hopper.enabled .Values.tunnel.cloudflared.enabled -}}
{{- $parts = append $parts (dict "root" . "component" "cloudflared" "image" (printf "%s:%s" .Values.image.repository (.Values.image.tag | toString)) "script" "files/cloudflared.sh" "apiPort" 2000 "uid" 1000 "gid" 1000) -}}
{{- end -}}
{{- range $i, $p := $parts }}
{{- if $i }}
---
{{- end }}
{{ include "hopper.tunnelPod" $p }}
{{- end }}
