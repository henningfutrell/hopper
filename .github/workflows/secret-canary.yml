# The secret canary scan in its e2e mode (issue #1957, docs/design.md "The secret canary scan on a real container
# runtime: its e2e mode"): a box step with a vault secret, the hopper killed mid-step, on the runner's own rootless
# Podman, then a scan of the database, the WAL, the hosts' output and work dirs, and the runtime's containers, volumes,
# images and storage. Nightly on the default branch (dev), by hand, and on a pull request that changes the sandbox
# module, the vault or the tests themselves: `pr / test` has no Podman socket, so there the test skips. The other
# `secret-canary*` files (the in-process mode, which `pr / test` or the crash workflow also runs) run here too, so one
# run shows them all.
# The runner's Podman (4.9 on ubuntu-24.04) answers the hopper's `/v5.0.0/libpod` calls. Read-only and with no secrets:
# `pull_request`, never `pull_request_target`. Each canary is a random value the test makes; nothing reaches a real
# service.
name: secret-canary

on:
  schedule:
    - cron: '53 5 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main, dev, beta, stable]
    paths:
      - src/sandbox/**
      - src/vault/**
      - test/crash/secret-canary-*.test.ts
      - test/crash/need-world.ts
      - test/integration/secret-canary*.test.ts
      - test/support/secret-canary.ts
      - test/support/runtime-places.ts
      - vitest.crash.config.ts
      - .github/workflows/secret-canary.yml

permissions:
  contents: read

concurrency:
  group: secret-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Rootless Podman makes user namespaces; the runner's AppArmor may refuse them to a user that is not root.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: podman version && podman info --format '{{.Host.Security.Rootless}} {{.Store.GraphRoot}}'
      # The Podman API socket is a process of the step, so it starts in the step that runs the tests. The suite's own
      # Postgres starts through testcontainers on the runner's docker, as in `pr / test`.
      - name: Secret canary scan
        run: |
          sock="$RUNNER_TEMP/podman.sock"
          podman system service --time=0 "unix://$sock" &
          for _ in $(seq 1 30); do curl -sf --unix-socket "$sock" http://d/v5.0.0/libpod/_ping && break; sleep 1; done
          echo
          export HOPPER_TEST_PODMAN_SOCKET="unix://$sock"
          npx vitest run --config vitest.crash.config.ts test/crash/secret-canary-
          npx vitest run test/integration/secret-canary
