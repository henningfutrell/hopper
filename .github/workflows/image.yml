# Builds the Dockerfile and publishes it as the public image ghcr.io/henningfutrell/hopper (issue #125),
# the image compose.yaml pulls. One tag per update channel (issue #423): `dev`, `beta` and `stable` follow
# the branch of that name, `latest` follows `stable`, and `sha-<commit>` pins one build. `canary` follows the
# stable candidate on the canary branch, which the canary subset pulls first (issue #1073 part 5). Intel/AMD and ARM
# (arm64 is built under QEMU). Pushed with the workflow's own token; the package is public.
name: image

on:
  push:
    branches: [dev, beta, canary, stable]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Runs queue, never cancel: a newer push waits for the build in progress, and GitHub keeps only the
# newest pending run. Cancelling left `latest` hours behind whenever merges came a few minutes apart
# (issue #156). One queue per branch: a promotion is not held behind a dev build.
concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/henningfutrell/hopper
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'stable' }}
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          # What the image is built from, written into it (issue #409): Settings → Version history and the update check.
          build-args: |
            HOPPER_REPO=${{ github.server_url }}/${{ github.repository }}.git
            HOPPER_BRANCH=${{ github.ref_name }}
            HOPPER_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The sandbox boxes Add machine's line runs (issue #308, scripts/box/Dockerfile), one per harness (issue #865,
  # src/sandbox/box-image.ts BOX_AGENTS): tags of the same public
  # package, `box-<agent>` following stable, `box-<agent>-<branch>` following each channel's branch and
  # `box-<agent>-sha-<commit>` pinning one build, so a box pulls with no sign-in as the hopper's image does.
  box:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, cursor, omp, opencode]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/henningfutrell/hopper
          flavor: latest=false
          tags: |
            type=raw,value=box-${{ matrix.agent }},enable=${{ github.ref_name == 'stable' }}
            type=ref,event=branch,prefix=box-${{ matrix.agent }}-
            type=sha,format=short,prefix=box-${{ matrix.agent }}-sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/box/Dockerfile
          build-args: AGENT=${{ matrix.agent }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=box-${{ matrix.agent }}
          cache-to: type=gha,mode=max,scope=box-${{ matrix.agent }}

  # The tools images of the sandbox boxes (issue #1286): each box image with every box tool added, as the hopper adds
  # them to a box's image (src/sandbox/tools.ts), for a container runtime that builds nothing (Kubernetes,
  # src/sandbox/launch.ts `publishedToolsImage`). Tags: the box image's, with `-tools`, and with `-tools-read-only` for a
  # read-only template's boxes (terraform behind the read-only wrapper). Built on the box image of this commit.
  box-tools:
    needs: box
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, cursor, omp, opencode]
        variant: [tools, tools-read-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/henningfutrell/hopper
          flavor: latest=false
          tags: |
            type=raw,value=box-${{ matrix.agent }}-${{ matrix.variant }},enable=${{ github.ref_name == 'stable' }}
            type=ref,event=branch,prefix=box-${{ matrix.agent }}-,suffix=-${{ matrix.variant }}
            type=sha,format=short,prefix=box-${{ matrix.agent }}-sha-,suffix=-${{ matrix.variant }}
      - name: Write the Containerfile
        env:
          READ_ONLY: ${{ matrix.variant == 'tools-read-only' && '--read-only' || '' }}
        run: node scripts/box-tools-containerfile.ts "ghcr.io/henningfutrell/hopper:box-${{ matrix.agent }}-sha-${GITHUB_SHA::7}" $READ_ONLY > box-tools.Containerfile
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: box-tools.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=box-${{ matrix.agent }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=box-${{ matrix.agent }}-${{ matrix.variant }}
