# Builds the Dockerfile and publishes it as the public image ghcr.io/henningfutrell/hopper (issue #125),
# the image compose.yaml pulls: `latest` follows main, `sha-<commit>` pins one build. Intel/AMD and ARM
# (arm64 is built under QEMU). Pushed with the workflow's own token; the package is public.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Runs queue, never cancel: a newer push waits for the build in progress, and GitHub keeps only the
# newest pending run. Cancelling left `latest` hours behind main whenever merges came a few minutes
# apart (issue #156).
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/henningfutrell/hopper
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The sandbox boxes Add machine's line runs (issue #308, scripts/box/Dockerfile): tags of the same public
  # package, `box-<agent>` following main and `box-<agent>-sha-<commit>` pinning one build, so a box pulls
  # with no sign-in as the hopper's image does.
  box:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [claude]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/henningfutrell/hopper
          flavor: latest=false
          tags: |
            type=raw,value=box-${{ matrix.agent }}
            type=sha,format=short,prefix=box-${{ matrix.agent }}-sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/box/Dockerfile
          build-args: AGENT=${{ matrix.agent }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=box-${{ matrix.agent }}
          cache-to: type=gha,mode=max,scope=box-${{ matrix.agent }}
