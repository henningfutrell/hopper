# The kind check (issue #1281, scripts/kind-check.ts, docs/deploy.md "Check the chart on kind"): on a fresh kind
# cluster, `helm install` alone brings up the hopper, and no pod anywhere in the cluster has a Podman or Docker socket,
# or runs Podman, Docker or compose. Then the sandbox check (issue #1371, scripts/kind-sandbox-check.ts) runs need boxes
# through this checkout's Kubernetes runtime on the cluster the kind check kept, and nothing with their labels may stay;
# with issue #1422 also the boxes' limits, their isolation, and dozens at once through the sandbox module.
# Then the cluster migration check (issue #1373, scripts/kind-migrate-check.ts) moves a compose install onto a kind
# cluster of its own. Only on a pull request that changes the chart, the checks, the cluster script or the sandbox
# module: it takes about thirty minutes.
# The hopper's image is the dev channel's: a pull request's own code is not built into an image. Read-only and with no
# secrets: `pull_request`, never `pull_request_target`. kind, helm and kubectl are the runner image's own.
name: kind

on:
  pull_request:
    branches: [main, dev, beta, stable]
    paths:
      - deploy/helm/**
      - scripts/kind-check.ts
      - scripts/kind-sandbox-check.ts
      - scripts/kind-sandbox-cases.ts
      - scripts/kind-migrate-check.ts
      - scripts/hopper-cluster.sh
      - src/sandbox/**
      - src/domain/sandboxes.ts
      - src/domain/sandbox-runs.ts
      - .github/workflows/kind.yml

permissions:
  contents: read

concurrency:
  group: kind-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: kind version && helm version --short && kubectl version --client
      - run: npm ci
      - run: node scripts/kind-check.ts --tag dev --keep
      - run: node scripts/kind-sandbox-check.ts --context kind-hopper-check
      - if: always()
        run: kind delete cluster --name hopper-check
      - run: node scripts/kind-migrate-check.ts --tag dev
