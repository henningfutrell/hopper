# The kind check (issue #1281, scripts/kind-check.ts, docs/deploy.md "Check the chart on kind"): on a fresh kind
# cluster, `helm install` alone brings up the hopper, and no pod anywhere in the cluster has a Podman or Docker socket,
# or runs Podman, Docker or compose. Only on a pull request that changes the chart or the check: it takes about ten
# minutes. The hopper's image is the dev channel's: a pull request's own code is not built into an image. Read-only and
# with no secrets: `pull_request`, never `pull_request_target`. kind, helm and kubectl are the runner image's own.
name: kind

on:
  pull_request:
    branches: [main, dev, beta, stable]
    paths:
      - deploy/helm/**
      - scripts/kind-check.ts
      - .github/workflows/kind.yml

permissions:
  contents: read

concurrency:
  group: kind-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: kind version && helm version --short && kubectl version --client
      - run: node scripts/kind-check.ts --tag dev
