# Publishes site/ (the install page) to GitHub Pages, with scripts/get.sh as install.sh beside it, so
# `curl -fsSL https://henningfutrell.github.io/hopper/install.sh | bash` installs, and compose.yaml, the
# container install, which pulls the published image (issues #119, #125). No build step.
name: pages

on:
  push:
    branches: [main]
    paths: [site/**, scripts/get.sh, compose.yaml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp scripts/get.sh site/install.sh && cp compose.yaml site/compose.yaml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
